output_dir: ./outputs/inference

batch_size: 2
dataloader_num_workers: 2
dataset_path: ./data/OBER/data

base_model_type: objectclear
base_model_path: jixin0101/ObjectClear
cache_dir: ~
fuse_index: 5
model_t: 0
coeff_t: 0
lora_rank: 256
lora_modules: ["to_q","to_k","to_v","to_out.0","proj_in","proj_out","ff.net.0.proj","ff.net.2","conv1","conv2","conv_shortcut","downsamplers.0.conv","upsamplers.0.conv","time_emb_proj"]
use_ema: false
ema_decay: 0.999
resume_ema: false

lambda_gan: 0.5
lambda_lpips: 5
lambda_l2: 1
lr_G: 1e-5
lr_D: 1e-5
optimizer_type: adam
opt_kwargs:
  betas: [0.9, 0.999]

mixed_precision: bf16
seed: 231
max_train_steps: 30000
gradient_accumulation_steps: 1
gradient_checkpointing: true
max_grad_norm: 1.0
logging_dir: logs
report_to: tensorboard
checkpointing_steps: 500
checkpoints_total_limit: 2
resume_from_checkpoint: ~
log_image_steps: 100
log_grad_steps: 100
log_grad_modules: [conv_out]
log_grads: false

use_vae: true
use_D: true
